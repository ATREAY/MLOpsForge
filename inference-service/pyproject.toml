[project]
name = "mlopsforge-inference-service"
version = "0.1.0"
description = "Loads a registered model's checkpoint via its plugin and serves predictions over REST"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # This service is the one place outside a Slurm job that actually imports
    # and runs plugin code (see docs/ARCHITECTURE.md) — so unlike backend and
    # training-service, it needs every plugin's runtime deps, same as
    # plugins/base/requirements.txt.
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

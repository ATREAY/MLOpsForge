name: gcn_baseline
version: "0.1.0"
description: >
  Minimal from-scratch GCN for node classification. Exists to prove the
  BaseModelPlugin interface is model-agnostic, not shaped around SAMamba.
task_type: node-classification
entrypoint: "plugins.gcn_baseline.plugin:GCNBaselinePlugin"

default_resources:
  partition: cse-gpu-all
  gpus: 0
  cpus_per_task: 2
  mem_gb: 4
  time_limit: "00:30:00"

config_schema:
  type: object
  properties:
    learning_rate:
      type: number
      default: 0.01
      minimum: 0.00001
    epochs:
      type: integer
      default: 100
      minimum: 1
    hidden_dim:
      type: integer
      default: 16
      minimum: 4
    weight_decay:
      type: number
      default: 0.0005
    seed:
      type: integer
      default: 42
  required: [learning_rate, epochs]
